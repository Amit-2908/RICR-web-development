<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RegistrationForm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <header class="position-sticky top-0">
      <div
        class="container-fluid bg-primary px-3 py-1 d-flex justify-content-between"
      >
        <div class="d-flex gap-3">
          <img
            src="image.png"
            alt="photo"
            width="50px"
            height="50px"
            class="rounded-circle"
          />
          <h1 class="text-light">Registration form</h1>
        </div>
        <button class="btn btn-info">Student Login</button>
      </div>

      <main>
        <div class="container bg-white border border-3 rounded shadow p-3 mt-3">
          <div class="border border-dark p-3 pt-4 position-relative">
            <span
              class="px-2 fs-5 position-absolute bg-white text-primary"
              style="top: -15px"
              >Personal Information</span
            >

            <div class="d-grid gap-2">
              <div class="d-flex align-items-center">
                <label for="fullName" class="form-label w-25"
                  >Full Name:<sup class="text-danger">*</sup>
                </label>
                <input
                  type="text"
                  name="fullName"
                  id="fullName"
                  class="form-control"
                  placeholder="Enter your name"
                  required
                />
              </div>

              <div class="d-flex align-items-center">
                <label for="UserEmail" class="form-label w-25"
                  >Email Address:<sup class="text-danger">*</sup></label
                >
                <input
                  type="email"
                  name="UserEmail"
                  id="UserEmail"
                  class="form-control"
                  required
                />
              </div>

              <div class="d-flex align-items-center">
                <label for="UserNumber" class="form-label w-25"
                  >Mobile Number:<sup class="text-danger">*</sup></label
                >
                <input
                  type="number"
                  name="UserNumber"
                  id="UserEmail"
                  class="form-control"
                  required
                />
              </div>

              <div class="d-flex align-items-center">
                <label for="UserDob" class="form-label w-25"
                  >D.O.B:<sup class="text-danger">*</sup></label
                >
                <input
                  type="date"
                  name="UserDob"
                  id="UserDob"
                  class="form-control"
                  required
                />
              </div>
            </div>
          </div>

          //
          <div class="border border-dark p-3 pt-4 position-relative">
            <span
              class="px-2 fs-5 position-absolute bg-white text-primary"
              style="top: -15px"
              >Academic Details</span
            >

            <div class="d-grid gap-2">
              <div class="d-flex align-items-center">
                <label for="fullName" class="form-label w-25"
                  >Oualification:<sup class="text-danger">*</sup>
                </label>
                <select name="Qualification" id="Qualification">
                  <option value="">--Select--</option>
                  <option value="10th standard">10th standard
                  </option>
                  <option value="12th standard">12th standard</option>
                  <option value="UG">UG</option>
                  <option value="PG">PG</option>
                  <option value="PHD">PHD</option>
                </select>
              </div>

              <div class="d-flex align-items-center">
                <label for="UserEmail" class="form-label w-25"
                  >Email Address:<sup class="text-danger">*</sup></label
                >
                <input
                  type="email"
                  name="UserEmail"
                  id="UserEmail"
                  class="form-control"
                  required
                />
              </div>

              <div class="d-flex align-items-center">
                <label for="UserNumber" class="form-label w-25"
                  >Mobile Number:<sup class="text-danger">*</sup></label
                >
                <input
                  type="number"
                  name="UserNumber"
                  id="UserEmail"
                  class="form-control"
                  required
                />
              </div>

              <div class="d-flex align-items-center">
                <label for="UserDob" class="form-label w-25"
                  >D.O.B:<sup class="text-danger">*</sup></label
                >
                <input
                  type="date"
                  name="UserDob"
                  id="UserDob"
                  class="form-control"
                  required
                />
              </div>
            </div>
          </div>

          #
          <div class="border border-dark p-3 pt-4 position-relative">
            <span
              class="px-2 fs-5 position-absolute bg-white text-primary"
              style="top: -15px"
              >Guardian Details</span
            >

            <div class="d-grid gap-2">
              <div class="d-flex align-items-center">
                <label for="Guardian’s Full Name" class="form-label w-25"
                  >Guardian Full Name:<sup class="text-danger">*</sup>
                </label>
                <input
                  type="text"
                  name="Guardian’s Full Name"
                  id="Guardian’s Full Name"
                  class="form-control"
                  placeholder="Enter your Guardian Name"
                  required
                />
              </div>

              <div class="d-flex align-items-center">
                <label for="Guardian’s Contact Number" class="form-label w-25"
                  >Guardian Contact Number:<sup class="text-danger"
                    >*</sup
                  ></label
                >
                <input
                  type="tel"
                  name="Guardian’s Contact Number"
                  id="Guardian’s Contact Number"
                  placeholder="+91"
                  class="form-control"
                  required
                />
              </div>
            </div>
          </div>

          <div class="d-flex gap-5 mt-3 border border-danger">
            <div class="d-flex gap-2">
              <label for="Batch">Batches:</label>
              <input
                type="checkbox"
                name="Batch"
                id="Batch"
                value="morning"
              /><span>morning</span>
            </div>
            <div class="d-flex gap-2">
              <input
                type="checkbox"
                name="Batch"
                id="Evening"
                value="evening"
              /><span>evening</span>
            </div>
            <div class="d-flex gap-2">
              <input
                type="checkbox"
                name="Batch"
                id="AfterNoon"
                value="afternoon"
              /><span>afternoon</span>
            </div>
          </div>

          <button class="btn btn-success" onclick="submit('yes')">submit</button>
        </div>
      </main>
    </header>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      src="index.js"
    ></script>
  </body>
</html>
