<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuessNumber</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-dark">
    <div class="mt-5 ">
      <div
        class="container bg-white border border-1 border-danger w-50 rounded p-4 "
      >
        <h1 class="d-flex justify-content-center">Guess The Number</h1>
        <p class="d-flex justify-content-center">
          We have to select a random Number (1-10).See if you can guess it.
        </p>
        <div class="d-flex justify-content-start m-2 gap-3">
            <label for="GuessNumber" class="">Guess a Number:</label>
            <input type="text" name="GuessNumber" id="GuessNumber" class="form-control"  >
            <button class="btn btn-secondary form-control w-25" onclick="Guess()"> Submit Guess</button>
        </div>
        <label id="Display" class="d-flex justify-content-center"></label>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
