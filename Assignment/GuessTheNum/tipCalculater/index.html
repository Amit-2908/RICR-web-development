<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip CalCulater</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    
  </head>
  <body style="background-color: #d2fbf3">
    <main class="mt-5">
      <div class="container w-100 h-auto h2 p-5">
        <h1 class="text-center mb-5 fw-bold">Tip Calculator</h1>
        <div
          class="container rounded border border-2 border-info w-50 d-flex h-75 shadow"
          style="background-color: white"
        >
          <div class="m-3 p-3">
            <div class="my-1 fs-4">
              <label for="billAmount">Bill amount</label>
              <input
                type="text"
                name="billAmount"
                id="billAmount"
                class="form-control mt-1"
              />
            </div>

            <div class="my-2 fs-4">
              <label for="Tip">Select Tip %</label>
              <div class="d-flex justify-content-evenly flex-wrap my-2 gap-3">
                <select name="selectTip" id="Tip" class="form-control">
                  <option value="">--Select--</option>
                  <option value="25">25%</option>
                  <option value="20">20%</option>
                  <option value="15">15%</option>
                  <option value="10">10%</option>
                  <option value="5">5%</option>
                </select>
              </div>
            </div>

            <div class="my-2 fs-4">
              <label for="numOfPeople">Number of People</label>
              <input
                type="text"
                name="numOfPeople"
                id="numOfPeople"
                class="form-control my-2"
              />
            </div>
          </div>

          <div
            class="container w-50 m-4 p-2 rounded shadow "
            style="background-color: #24616c"
          >
            <div class="d-flex justify-content-around fs-5 gap-4 mt-5">
              <label for=""
                >Tip Amount <br />
                <span>/ person</span>
              </label>
              <label id="perPersonTip" class="text-info fs-4">0.00$</label>
            </div>
            <div class="d-flex justify-content-around fs-5 gap-2 my-3">
              <label for=""
                >Total Amount <br />
              
              </label>
              <label id="totalAmount" class="text-info fs-4">0.00$</label>
            </div>

            <div class="d-flex justify-content-center">
              <button class="btn btn-info mt-3" onclick="Calculate()">Calculate</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
