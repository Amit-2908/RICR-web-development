<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoEditor</title>
  </head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="style.css" />
  <body>
    <header  >
      <div
        class="container-fluid bg-primary px-3 py-2 text-center display-6 fw-bold text-light "
      >
        Image Editor
      </div>
    </header>
    <main>
      <div class="mx-3 border shadow  d-flex gap-3" id="content">
        <div class="border border-5 border-success-subtle shadow w-25 p-3">
          <div
            class="d-flex flex-column align-items-center border  rounded shadow mb-3"
          >
            <label for="Brightness">Brightness</label>
            <input
              type="range"
              name="Brightness"
              id="Brightness"
              min="0"
              max="100"
              value="50"
              onchange="changeBrightness()"
              class="form-range px-3"
            />

            <div class="px-3 d-flex justify-content-between w-100">
              <span>0</span>
              <span>100</span>
            </div>
          </div>

          <div
            class="d-flex flex-column align-items-center border rounded shadow mb-3"
          >
            <label for="Contrast">Contrast</label>
            <input
              type="range"
              name="Contrast"
              id="Contrast"
              min="0"
              max="100"
              value="50"
              onchange="changeContrast()"
              class="form-range px-3"
            />

            <div class="px-3 d-flex justify-content-between w-100">
              <span>0</span>
              <span>100</span>
            </div>
          </div>

          <div
            class="d-flex flex-column align-items-center border rounded shadow mb-3"
          >
            <label for="GrayScale">GrayScale</label>
            <input
              type="range"
              name="GrayScale"
              id="GrayScale"
              min="0"
              max="100"
              value="50"
              onchange="changeGrayScale()"
              class="form-range px-3"
            />

            <div class="px-3 d-flex justify-content-between w-100">
              <span>0</span>
              <span>100</span>
            </div>
          </div>

          <div
            class="d-flex flex-column align-items-center border rounded shadow mb-3"
          >
            <label for="Sepia">Sepia</label>
            <input
              type="range"
              name="Sepia"
              id="Sepia"
              min="0"
              max="100"
              value="50"
              onchange="changeSepia()"
              class="form-range px-3"
            />

            <div class="px-3 d-flex justify-content-between w-100">
              <span>0</span>
              <span>100</span>
            </div>
          </div>

          <div
            class="d-flex flex-column align-items-center border rounded shadow mb-3"
          >
            <label for="Invert">Invert</label>
            <input
              type="range"
              name="Invert"
              id="Invert"
              min="0"
              max="100"
              value="50"
              onchange="changeInvert()"
              class="form-range px-3"
            />

            <div class="px-3 d-flex justify-content-between w-100">
              <span>0</span>
              <span>100</span>
            </div>
          </div>


          <div>
             <button class="btn btn-outline-danger w-100 mb-3  " onclick="reset()">
              <i class="bi bi-arrow-clockwise"></i> Reset
            </button>
            <button class="btn btn-outline-success w-100" onclick="download()">
              <i class="bi bi-download"></i> Download
            </button>
          </div>

         
        </div>

         

        <!-- <img src="" alt=""> -->
        <div
          class="border border-5 border-success-subtle  shadow w-75 d-flex justify-content-center align-items-center"
          id="workspace"
        >
          <img
            src=" "
            alt="Workimage"
            id="image"
            class="border object-fit-contain"
          />
          <label for="Upload" class="btn btn-outline-primary" id="uploadLabel">
            <i class="bi bi-camera"></i> Upload Image
          </label>
          <input
            type="file"
            name="Upload"
            id="Upload"
            class="d-none"
            onchange="uploadImage()"
            accept="image/*"
          />
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
