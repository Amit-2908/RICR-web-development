<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="bg-primary mb-5">
      <div class="d-flex justify-content-center fs-3 text-white">
        Form Validation
      </div>
    </div>
    <div class="container ms-5 w-50 gap-3">
      <div>
        <div class="container d-flex justify-content-center gap-3 mb-1">
          <label for="fullName">Name:</label>
          <input type="text" name="Name" id="fullName" class="form-control" />
        </div>
        <span class="text-danger fs-6 float-end Error" id="NameError"></span>
      </div>

      <div>
        <div class="container d-flex justify-content-center gap-3 mb-1">
          <label for="Email">Email:</label>
          <input type="email" name="Email" id="Email" class="form-control" />
        </div>
        <span class="text-danger fs-6 float-end Error" id="EmailError"></span>
      </div>

      <div>
        <div class="container d-flex justify-content-center gap-3 mb-1">
          <label for="Phone">Phone:</label>
          <input type="tel" name="Phone" id="Phone" class="form-control" />
        </div>
        <span class="text-danger fs-6 float-end Error" id="PhoneError"></span>
      </div>

      <div>
        <div class="container d-flex justify-content-center gap-3 mb-1">
          <label for="DOB">DOB:</label>
          <input type="date" name="DOB" id="DOB" class="form-control" />
        </div>
        <span class="text-danger fs-6 float-end Error" id="DOBError"></span>
      </div>

      <div class="container d-flex justify-content-center mt-2 gap-3">
        
        <button class="btn btn-primary w-50" onclick="Submit()">submit</button>

      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
