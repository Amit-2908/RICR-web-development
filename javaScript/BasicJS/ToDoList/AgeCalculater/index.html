<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculater</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-dark">
    <nav>
      <div
        class="bg-dark-subtle w-100 d-flex justify-content-center p-2 fw-bolder fs-2"
      >
        Calculater
      </div>
    </nav>
    <main class="d-flex justify-content-center  mt-3 ">
      <div class="border border-1 border-danger w-25 text-white shadow p-3">
        <h1 class="d-flex justify-content-center">AGE Calculater</h1>
        <div class="">
          <label  class="d-flex justify-content-center fs-5 mb-3"
            >Enter your Date of Birth</label>
          <input type="date" class="form-control" id="DateOfBirth">
        </div>
       
        
        <div class="d-flex justify-content-center mt-1">
            <button class="btn btn-primary " onclick="calculate()" >Calulate</button>
            
        </div>
        <label id="result" class="d-flex justify-content-center"></label>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
