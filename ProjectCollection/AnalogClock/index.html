<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="clock">
            <label style="--i: 1">1</label>
            <label style="--i: 2">2</label>
            <label style="--i: 3">3</label>
            <label style="--i: 4">4</label>
            <label style="--i: 5">5</label>
            <label style="--i: 6">6</label>
            <label style="--i: 7">7</label>
            <label style="--i: 8">8</label>
            <label style="--i: 9">9</label>
            <label style="--i: 10">10</label>
            <label style="--i: 11">11</label>
            <label style="--i: 12">12</label>

            <div class="indicator">
                <span class="hand hour"></span>
                <span class="hand minute"></span>
                <span class="hand second"></span>
            
            </div>
        </div>
        <div class="mode-switch"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
