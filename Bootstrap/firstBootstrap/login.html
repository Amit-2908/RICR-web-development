<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bootStrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    
  </head>

  <body class="">
    
    <div id="mainDiv " class="bg-primary  d-flex  justify-content-sm-center  align-items-center gap-5  py-5   m-5 ">

      <div class="loginForm , border border-black rounded-3 ,  w-25 , height h-50, d-flex flex-column  , p-3  , bg-white mt-b ">
        <h2 class="mb-5">Login</h2>
        <input type="email" placeholder="Enter your email" id="LoginEmail" class="p-1 m-2 border-0 border-bottom border-dark border-outline-0" />
        <input type="password" placeholder="confirm a password" id="LoginPassword" class="p-1 m-2 border-0 border-bottom border-dark " /> 
        <div class=" ">
          <input
          type="checkbox"
          id="CheckBox"
          name="checkbox"
          value="Remember me"
          class="m-1"
          
          /><label for="checkbox" class="m-1">Remember me</label>
          <a href="#" class="mx-4 text-decoration-none" >Forgot password?</a>
        </div>
        
        <button  class="mt-3  text-white p-2 border rounded btn btn-primary" onclick="Login()">Login Now</button>
        <span class="mt-3 ">Don't have an account? <a href="">Signup now</a></span>
      </div>

      <div class="registrationForm , border border-black rounded-3 ,  w-25 , height h-50, d-flex flex-column  , p-3  , bg-white mt-b ">
        <h2 class="mb-5">Registration</h2>
        <input type="text" placeholder="Enter your name" id="UserName" class=" mb-3 border-0 border-bottom border-dark"/>
        <input type="email" placeholder="Enter your email" id="UserEmail" class=" mb-3 border-0 border-bottom border-dark"/>
        <input type="password" placeholder="create a password" id="CreatePassword" class=" mb-3 border-0 border-bottom border-dark border-dark" />
        <input type="password" placeholder="confirm a password" id="ConfirmPassword" class="mb-3 border-0 border-bottom border-dark"/>
        <div>
           <input
          type="checkbox"
          id="CheckBox"
          name="checkbox"
          value="I accept all terms & conditions"
          class="mx-2"
        /><label for="checkbox" id="CheckBox">I accept all terms & conditions</label>
        </div>

        <button class="mt-3  text-white p-2 border rounded btn btn-primary" id="RegisterButton" onclick="Registration()">Register Now</button>
        <span class="mt-3">Already have an account? <a href="">Login now</a></span>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <Script src="index.js"></Script>
  </body>
</html>
