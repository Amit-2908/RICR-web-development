<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calci</title>
    <link rel="stylesheet" href="Calculater.css">
</head>
<body>
    <div class="container ">
        <div id="display">
            <input type="text" name="Dis" id="Dis" class="display" placeholder="0">
        </div>
        <div class="mainContainer">
            <div class="btnContainer "><button class="btn" onclick="Input('7')">7</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('8')">8</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('9')">9</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('/')">/</button></div> 
            <div class="btnContainer "><button class="btn" onclick="Input('4')">4</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('5')">5</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('6')">6</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('*')">*</button></div>
            
            <div class="btnContainer "><button class="btn" onclick="Input('1')">1</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('2')">2</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('3')">3</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('-')">-</button></div>
            
            <div class="btnContainer "><button class="btn" onclick="Input('.')">.</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('0')">0</button></div>
            <div class="btnContainer "><button class="btn" onclick="Input('+')">+</button></div>
            <div class="btnContainer "><button class="btn" id="redColor" onclick="Input('C')">C</button></div>

        </div>
        <div class="equal"><button class="btn" id="equalBtn" onclick="Input('=')">=</button></div>
        
    </div>
    <script src="Calculater.js"></script>
</body>
</html>
